name: Build iOS App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter iOS IPA
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: apps/mobile/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('apps/mobile/ios/Podfile.lock', 'apps/mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Get Dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS IPA & Archive
        run: flutter build ipa --release --no-codesign

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/ios/ipa_payload/Payload
          cp -r build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app build/ios/ipa_payload/Payload/
          cd build/ios/ipa_payload
          zip -r -q ../Acadyk-release-unsigned.ipa Payload
          cd ../../..
          cd build/ios/archive
          zip -r -q ../Runner.xcarchive.zip Runner.xcarchive
          cd ../../..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: acadyk-release-ios-ipa
          path: apps/mobile/build/ios/Acadyk-release-unsigned.ipa
          if-no-files-found: error

      - name: Upload iOS XCArchive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: acadyk-release-ios-xcarchive
          path: apps/mobile/build/ios/Runner.xcarchive.zip
          if-no-files-found: warn
