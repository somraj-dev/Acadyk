name: Manual iOS Build (.app & .ipa)

on:
  workflow_dispatch:
    inputs:
      build_simulator:
        description: 'Also build iOS Simulator .app bundle'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    name: Build Flutter iOS (.app & .ipa)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: apps/mobile/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('apps/mobile/ios/Podfile.lock', 'apps/mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Get Dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iPhone Release (.app & .ipa)
        run: |
          echo "Building iOS Release .app for iPhone..."
          flutter build ios --release --no-codesign
          
          mkdir -p build/ios/outputs
          
          # 1. Copy Runner.app
          cp -R build/ios/iphoneos/Runner.app build/ios/outputs/Acadyk.app
          
          # 2. Package .app.zip
          cd build/ios/iphoneos
          zip -r -q ../outputs/Acadyk-iphone-release.app.zip Runner.app
          cd ../../..
          
          # 3. Package .ipa
          mkdir -p build/ios/ipa_payload/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa_payload/Payload/
          cd build/ios/ipa_payload
          zip -r -q ../outputs/Acadyk-manual-unsigned.ipa Payload
          cd ../../..

      - name: Build iOS Simulator (.app)
        if: ${{ inputs.build_simulator == 'true' }}
        run: |
          echo "Building iOS Simulator .app..."
          flutter build ios --simulator --debug
          
          # Copy simulator Runner.app
          cp -R build/ios/iphonesimulator/Runner.app build/ios/outputs/Acadyk-Simulator.app
          
          # Package into Simulator .app.zip
          cd build/ios/iphonesimulator
          zip -r -q ../outputs/Acadyk-simulator.app.zip Runner.app
          cd ../../..

      - name: Upload iPhone .app Bundle
        uses: actions/upload-artifact@v4
        with:
          name: acadyk-manual-iphone-app
          path: apps/mobile/build/ios/outputs/Acadyk.app
          if-no-files-found: error

      - name: Upload iPhone .app.zip
        uses: actions/upload-artifact@v4
        with:
          name: acadyk-manual-iphone-app-zip
          path: apps/mobile/build/ios/outputs/Acadyk-iphone-release.app.zip
          if-no-files-found: error

      - name: Upload iPhone .ipa
        uses: actions/upload-artifact@v4
        with:
          name: acadyk-manual-iphone-ipa
          path: apps/mobile/build/ios/outputs/Acadyk-manual-unsigned.ipa
          if-no-files-found: error

      - name: Upload Simulator .app Bundle
        if: ${{ inputs.build_simulator == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: acadyk-manual-simulator-app
          path: apps/mobile/build/ios/outputs/Acadyk-Simulator.app
          if-no-files-found: error

      - name: Upload Simulator .app.zip
        if: ${{ inputs.build_simulator == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: acadyk-manual-simulator-app-zip
          path: apps/mobile/build/ios/outputs/Acadyk-simulator.app.zip
          if-no-files-found: error
