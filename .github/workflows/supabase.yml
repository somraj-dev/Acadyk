name: Supabase Database & Edge Functions Verification

on:
  push:
    paths:
      - 'backend/supabase/**'
  pull_request:
    paths:
      - 'backend/supabase/**'

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Migration Files
        run: |
          echo "Verifying 19 SQL schema migration scripts in backend/supabase/migrations/"
          ls -la backend/supabase/migrations/*.sql
          test -f backend/supabase/migrations/000001_extensions.sql
          test -f backend/supabase/migrations/000019_functions_triggers.sql
          echo "All migration scripts verified successfully."
